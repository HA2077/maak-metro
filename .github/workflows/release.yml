name: Release APK

# Runs when you push a tag like v0.1-stable, or by hand from the Actions tab.
# Result: an APK you can download from the run page (and from the GitHub Release for tags).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # only needed to attach the APKs to a GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One APK per CPU type. For a modern phone, install app-arm64-v8a-release.apk.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: maak-metro-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Attach APKs to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes